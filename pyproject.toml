[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bakedboston-optimizer"
version = "0.1.0"
description = "Explainable route optimization for BakedBoston"
requires-python = ">=3.11"
dependencies = [
    "gurobipy>=13.0.0",
]

[project.scripts]
bakedboston-compare = "bakedboston_optimizer.compare:main"
bakedboston-simulate = "bakedboston_optimizer.simulate:main"
bakedboston-web-export = "bakedboston_optimizer.web_export:main"

[tool.setuptools.packages.find]
include = ["bakedboston_optimizer*"]

[tool.vercel]
entrypoint = "api.recommendations:handler"
