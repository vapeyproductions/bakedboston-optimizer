[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bakedboston-optimizer"
version = "0.1.0"
description = "Explainable route optimization for BakedBoston"
requires-python = ">=3.11"
dependencies = ["ortools>=9.10,<10"]

[project.optional-dependencies]
dev = ["ortools>=9.10,<10"]

[tool.setuptools.packages.find]
include = ["bakedboston_optimizer*"]

[tool.vercel]
entrypoint = "api.recommendations:handler"
